<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monster Mood Garden</title>
<style>
  :root {
    --bg1: #ffd1e8; --bg2: #cde8ff;
    --ink: #3d2f52;
    --card: #fffdf8;
    --accent: #ff6fa5;
    --soft: rgba(61,47,82,0.22);
    --bubble: #ffffff;
    --good: #58c98f; --bad: #ff8fa3;
  }
  html.dark {
    --bg1: #3b2e5c; --bg2: #23406b;
    --ink: #f4ecff;
    --card: #4a3a72;
    --accent: #ff9ec4;
    --soft: rgba(0,0,0,0.4);
    --bubble: #56447f;
    --good: #7ddba3; --bad: #ff9ec4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 14px;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    transition: background 0.4s, color 0.4s;
    display: flex; flex-direction: column; align-items: center;
  }

  /* ===== top bar: tiny title + theme toggle ===== */
  .topbar { width: 100%; max-width: 860px; display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 1.25rem; letter-spacing: 0.5px; }
  .topbar h1 .w1 { color: var(--accent); }
  .topbar h1 .w2 { color: #ffd23f; }
  .topbar h1 .w3 { color: #7ddba3; }
  html.dark .topbar h1 .w2 { color: #ffe066; }
  .theme-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 3px solid var(--ink); background: var(--bubble);
    font-size: 1.2rem; cursor: pointer;
    box-shadow: 0 3px 0 var(--soft);
  }

  /* ===== stage ===== */
  .stage {
    position: relative; width: 100%; max-width: 860px;
    margin-top: 10px;
    display: flex; flex-direction: column; align-items: center;
    padding: 18px 0 8px;
  }
  .monster-wrap {
    position: relative; width: 340px; height: 400px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.4s;
  }
  .monster-wrap.bounce { transform: scale(1.05); }
  .flower-back { position: absolute; width: 330px; height: 330px; top: 30px; left: 5px; }
  #monster { position: relative; width: 210px; height: 250px; z-index: 2; }
  #monster svg { width: 100%; height: 100%; overflow: visible; }

  #pupils { transition: transform 0.3s; }
  #monster.happy #pupils { transform: translateY(-5px); }
  #monster.sad #pupils { transform: translateY(4px); }
  #cheeks { opacity: 0; transition: opacity 0.4s; }
  #monster.happy #cheeks { opacity: 1; }
  #mouth-happy, #mouth-sad { display: none; }
  #monster.happy #mouth-happy { display: block; }
  #monster.happy #mouth-meh, #monster.happy #mouth-sad { display: none; }
  #monster.sad #mouth-sad { display: block; }
  #monster.sad #mouth-meh, #monster.sad #mouth-happy { display: none; }

  .deco { position: absolute; border-radius: 50%; animation: pop 0.5s ease; z-index: 3; }
  @keyframes pop {
    0% { transform: scale(0); }
    70% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }
  .pimple { width: 14px; height: 12px; background: #ff9aa2; border: 2px solid #d65f6a; }
  .stain { width: 18px; height: 14px; background: #8a6a45; opacity: 0.8; border-radius: 60% 40% 55% 45%; }
  .sparkle { background: transparent !important; border: none !important; width: 18px; height: 18px; }
  .sparkle::before, .sparkle::after { content: ""; position: absolute; background: #ffe066; }
  .sparkle::before { left: 8px; top: 0; width: 4px; height: 18px; border-radius: 3px; }
  .sparkle::after { top: 8px; left: 0; width: 18px; height: 4px; border-radius: 3px; }
  .fluff { width: 16px; height: 14px; background: #fff; border: 2px solid #ffd9a8; border-radius: 50% 50% 40% 40%; }
  .bow {
    position: absolute; top: 44px; right: 4px; width: 0; height: 0;
    border-left: 16px solid #ff6fa5; border-right: 16px solid #ff6fa5;
    border-top: 10px solid transparent; border-bottom: 10px solid transparent;
    filter: drop-shadow(0 2px 0 #3d2f52);
  }

  /* ===== mood meter under monster ===== */
  .mood-line { margin-top: 4px; font-weight: bold; font-size: 0.95rem; display: flex; align-items: center; gap: 10px; }
  .meter-track { width: 140px; height: 12px; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; background: var(--bubble); }
  .meter-fill {
    height: 100%; width: 50%;
    background: linear-gradient(90deg, #ff6b6b, #ffd23f, #7ddba3);
    transition: width 0.5s;
  }

  /* ===== one input ===== */
  .talk-row { margin-top: 14px; width: 100%; max-width: 520px; display: flex; gap: 8px; }
  .talk-row input {
    flex: 1; padding: 13px 18px; border-radius: 999px;
    border: 3px solid var(--ink); font-size: 1rem; font-family: inherit;
    background: var(--bubble); color: var(--ink);
    box-shadow: 0 4px 0 var(--soft);
  }
  .talk-row button {
    border: 3px solid var(--ink); border-radius: 999px; padding: 12px 20px;
    background: var(--accent); color: #3d2f52; font-family: inherit;
    font-size: 1rem; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 0 var(--soft);
  }
  .talk-row button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--soft); }
  .mood-chips { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .chip {
    border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px;
    font-size: 0.8rem; font-weight: bold; cursor: pointer; font-family: inherit;
    background: var(--bubble); color: var(--ink); box-shadow: 0 2px 0 var(--soft);
  }
  .chip.on { background: #ffd23f; }
  .feedback { margin-top: 10px; font-size: 0.92rem; font-weight: bold; min-height: 1.3em; text-align: center; max-width: 520px; }

  /* ===== floating bubbles around monster ===== */
  .orbit {
    position: absolute; width: 58px; height: 58px; border-radius: 50%;
    border: 3px solid var(--ink); cursor: pointer; font-size: 1.4rem;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 var(--soft);
    z-index: 4;
  }
  .orbit:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--soft); }
  .orbit.journal { top: 40px; left: 0; background: #cde8ff; }
  .orbit.calm { bottom: 60px; left: 10px; background: #e8d5ff; }
  .orbit.reflect { top: 40px; right: 0; background: #d9f7e8; }
  .orbit-count {
    position: absolute; top: -8px; right: -8px;
    background: #ff6fa5; color: #3d2f52; border: 2px solid var(--ink);
    font-size: 0.7rem; font-weight: bold; border-radius: 999px;
    padding: 1px 7px;
  }

  /* ===== popover panels (speech bubbles) ===== */
  .panel {
    position: absolute; width: 260px; max-height: 300px; overflow: auto;
    background: var(--bubble); border: 3px solid var(--ink); border-radius: 20px;
    padding: 14px; box-shadow: 6px 6px 0 var(--soft);
    display: none; z-index: 6; font-size: 0.88rem;
  }
  .panel.open { display: block; animation: pop 0.3s ease; }
  .panel h3 { font-size: 1rem; margin-bottom: 8px; }
  .panel .close-x {
    position: absolute; top: 6px; right: 8px; border: none; background: none;
    font-size: 1rem; cursor: pointer; color: var(--ink); font-family: inherit;
  }
  .panel-left { left: 0; top: 100px; }
  .panel-left.calm-pos { top: auto; bottom: 20px; }
  .panel-right { right: 0; top: 100px; }
  .entry {
    display: flex; align-items: center; gap: 8px;
    border: 2px solid var(--ink); border-radius: 14px;
    padding: 8px 10px; margin-bottom: 8px;
    background: var(--card);
  }
  .entry.positive { background: #eafbf2; color: #3d2f52; }
  .entry.negative { background: #fff0f5; color: #3d2f52; }
  html.dark .entry.positive { background: #2e5c46; color: #f4ecff; }
  html.dark .entry.negative { background: #6b3a4d; color: #f4ecff; }
  .entry .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 2px solid var(--ink); }
  .entry.positive .dot { background: #58c98f; }
  .entry.negative .dot { background: #ff8fa3; }
  .entry .tag { font-size: 0.68rem; padding: 2px 8px; border-radius: 999px; border: 2px solid var(--ink); font-weight: bold; }
  .tag.calm { background: #cde8ff; } .tag.stressed { background: #ffd1dc; }
  .tag.grateful { background: #ffe9a8; } .tag.upset { background: #e8d5ff; }
  .tag.happy { background: #d9f7e8; } .tag.tired { background: #e8e4f7; }

  /* calm panel content */
  .breath-circle {
    width: 64px; height: 64px; border-radius: 50%; margin: 10px auto;
    background: #6ec6ff; border: 3px solid #3d2f52;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; color: #3d2f52; font-weight: bold;
    transition: transform 3s ease-in-out;
  }
  .breath-circle.big { transform: scale(1.5); }
  .panel-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .mini-btn {
    flex: 1; border: 2px solid #3d2f52; border-radius: 12px; padding: 7px 8px;
    font-family: inherit; font-size: 0.8rem; font-weight: bold; cursor: pointer;
    background: #fff; color: #3d2f52; box-shadow: 0 3px 0 #3d2f52;
  }
  .mini-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #3d2f52; }
  .mini-btn.go { background: #7ddba3; }
  .boost-line { margin-top: 8px; font-weight: bold; color: var(--ink); }

  /* reflection content */
  .panel ul { margin: 0 0 8px 16px; line-height: 1.6; color: var(--ink); }
  .panel .gentle {
    border-left: 6px solid var(--good); border-radius: 10px;
    background: var(--card); color: var(--ink);
    padding: 8px 10px; margin-top: 6px; line-height: 1.45;
  }
  .panel .next {
    border-left: 6px solid #ffd23f; border-radius: 10px;
    background: var(--card); color: var(--ink);
    padding: 8px 10px; margin-top: 8px; line-height: 1.45;
  }

  footer { margin-top: auto; padding: 16px 0 4px; font-size: 0.8rem; font-weight: bold; opacity: 0.75; }

  @media (max-width: 700px) {
    .monster-wrap { width: 280px; height: 340px; }
    .flower-back { width: 270px; height: 270px; }
    .panel-left, .panel-right { width: 220px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <h1><span class="w1">Monster</span> <span class="w2">Mood</span> <span class="w3">Garden</span></h1>
  <button class="theme-btn" id="btn-theme" title="Toggle dark / light">🌙</button>
</div>

<div class="stage">
  <button class="orbit journal" id="btn-journal-open" title="Word journal">💬<span class="orbit-count" id="journal-count">3</span></button>
  <button class="orbit calm" id="btn-calm-open" title="Calm reward">🌈</button>
  <button class="orbit reflect" id="btn-reflect-open" title="Weekly reflection">🔍</button>

  <div class="monster-wrap" id="monster-wrap">
    <svg class="flower-back" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="#fff" stroke="#3d2f52" stroke-width="1.6" opacity="0.9">

        <ellipse cx="50" cy="84" rx="13" ry="18" transform="rotate(180 50 84)"/>

    <div id="monster">

        <path d="M164,62 Q174,14 136,24 Q142,46 148,62 Z" fill="#e09154" stroke="#3d2f52" stroke-width="3"/>
        <path d="M44,54 Q40,26 58,30 Q54,44 51,54 Z" fill="#f2b8c6"/>
        <path d="M156,54 Q160,26 142,30 Q146,44 149,54 Z" fill="#f2b8c6"/>
        <g fill="#3d2f52">
          <circle cx="172" cy="130" r="18.5"/><circle cx="162" cy="171" r="18.5"/>
          <circle cx="136" cy="201" r="18.5"/><circle cx="100" cy="212" r="18.5"/>
          <circle cx="64" cy="201" r="18.5"/><circle cx="38" cy="171" r="18.5"/>
          <circle cx="28" cy="130" r="18.5"/><circle cx="38" cy="89" r="18.5"/>
          <circle cx="64" cy="59" r="18.5"/><circle cx="100" cy="48" r="18.5"/>
          <circle cx="136" cy="59" r="18.5"/><circle cx="162" cy="89" r="18.5"/>
        </g>
        <g fill="#e09154">
          <circle cx="172" cy="130" r="15"/><circle cx="162" cy="171" r="15"/>
          <circle cx="136" cy="201" r="15"/><circle cx="100" cy="212" r="15"/>
          <circle cx="64" cy="201" r="15"/><circle cx="38" cy="171" r="15"/>
          <circle cx="28" cy="130" r="15"/><circle cx="38" cy="89" r="15"/>
          <circle cx="64" cy="59" r="15"/><circle cx="100" cy="48" r="15"/>
          <circle cx="136" cy="59" r="15"/><circle cx="162" cy="89" r="15"/>
        </g>
        <ellipse cx="100" cy="130" rx="75" ry="85" fill="#ecab72"/>
        <circle cx="76" cy="92" r="19" fill="#fff" stroke="#3d2f52" stroke-width="3"/>
        <circle cx="124" cy="92" r="19" fill="#fff" stroke="#3d2f52" stroke-width="3"/>
        <g id="pupils">
          <circle cx="76" cy="96" r="10" fill="#5a3a22"/>
          <circle cx="124" cy="96" r="10" fill="#5a3a22"/>
          <circle cx="76" cy="96" r="4.5" fill="#1e1410"/>
          <circle cx="124" cy="96" r="4.5" fill="#1e1410"/>
          <circle cx="80" cy="90" r="2.6" fill="#fff"/>
          <circle cx="128" cy="90" r="2.6" fill="#fff"/>
        </g>
        <g id="cheeks">
          <ellipse cx="54" cy="122" rx="10" ry="6.5" fill="#ff9ec4"/>
          <ellipse cx="146" cy="122" rx="10" ry="6.5" fill="#ff9ec4"/>
        </g>
        <g id="mouth-happy">
          <use href="#grin-shape" fill="#ff8fae" stroke="#3d2f52" stroke-width="3.5"/>
          <g clip-path="url(#grin-clip)">
            <rect x="88" y="134" width="11" height="17" rx="2.5" fill="#fff" stroke="#3d2f52" stroke-width="2"/>
            <rect x="101" y="134" width="11" height="17" rx="2.5" fill="#fff" stroke="#3d2f52" stroke-width="2"/>
            <rect x="76" y="136" width="10" height="10" rx="2" fill="#fff" stroke="#3d2f52" stroke-width="2"/>
            <rect x="114" y="136" width="10" height="10" rx="2" fill="#fff" stroke="#3d2f52" stroke-width="2"/>
            <rect x="80" y="150" width="40" height="8" fill="#ff5f86" opacity="0.6"/>

        </g>
        <g id="mouth-meh">
          <path d="M82,148 Q100,154 118,148" fill="none" stroke="#3d2f52" stroke-width="4" stroke-linecap="round"/>
        </g>
        <g id="mouth-sad">
          <path d="M82,158 Q100,142 118,158" fill="none" stroke="#3d2f52" stroke-width="4" stroke-linecap="round"/>
        </g>
        <path d="M40,186 C40,210 62,221 100,221 C138,221 160,210 160,186 L160,174 L40,174 Z"
              fill="#4a7fd4" stroke="#3d2f52" stroke-width="3"/>
        <path d="M84,172 L68,124" stroke="#3d2f52" stroke-width="16" stroke-linecap="round"/>
        <path d="M116,172 L132,124" stroke="#3d2f52" stroke-width="16" stroke-linecap="round"/>
        <path d="M84,172 L68,124" stroke="#4a7fd4" stroke-width="11" stroke-linecap="round"/>
        <path d="M116,172 L132,124" stroke="#4a7fd4" stroke-width="11" stroke-linecap="round"/>
        <rect x="80" y="168" width="40" height="38" rx="7" fill="#4a7fd4" stroke="#3d2f52" stroke-width="3"/>
        <path d="M44,208 Q100,218 156,208 L156,216 Q100,226 44,216 Z" fill="#7aa5e8" stroke="#3d2f52" stroke-width="2.5"/>
        <rect x="86" y="180" width="28" height="19" rx="4" fill="#3a6bbf" stroke="#3d2f52" stroke-width="2.5"/>
        <rect x="88.5" y="182.5" width="23" height="14" rx="3" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="4 3"/>
        <circle cx="84" cy="171" r="5" fill="#f5c542" stroke="#3d2f52" stroke-width="2.5"/>
        <circle cx="116" cy="171" r="5" fill="#f5c542" stroke="#3d2f52" stroke-width="2.5"/>
        <circle cx="91" cy="176" r="4" fill="#f5c542" stroke="#3d2f52" stroke-width="2.5"/>
        <circle cx="109" cy="176" r="4" fill="#f5c542" stroke="#3d2f52" stroke-width="2.5"/>
        <use href="#star-patch" transform="translate(100,189) scale(0.85)" fill="#ffe066" stroke="#3d2f52" stroke-width="2"/>
        <use href="#star-patch" transform="translate(148,196) scale(0.75)" fill="#ffe066" stroke="#3d2f52" stroke-width="2"/>
        <circle cx="60" cy="196" r="6.5" fill="#ffe066" stroke="#3d2f52" stroke-width="2.5"/>
        <circle cx="57.8" cy="194" r="1" fill="#3d2f52"/>
        <circle cx="62.2" cy="194" r="1" fill="#3d2f52"/>
        <path d="M57,197.5 Q60,200 63,197.5" fill="none" stroke="#3d2f52" stroke-width="1.4"/>
      </svg>
      <div id="decorations"></div>
    </div>

    <!-- panels -->
    <div class="panel panel-left" id="panel-journal">
      <button class="close-x" data-close="panel-journal">✕</button>
      <h3>💬 Word Journal</h3>
      <div id="entry-list"></div>
    </div>
    <div class="panel panel-left calm-pos" id="panel-calm">
      <button class="close-x" data-close="panel-calm">✕</button>
      <h3 id="challenge-title">🌈 Tiny Breathing</h3>
      <p id="challenge-desc">Breathe in as the circle grows, out as it shrinks. Tap Done when calm.</p>
      <div class="breath-circle" id="breath-circle">breathe</div>
      <div class="panel-btns">
        <button class="mini-btn" id="btn-start">▶ Start</button>
        <button class="mini-btn go" id="btn-done">✔ Done</button>
        <button class="mini-btn" id="btn-next">🔀</button>
      </div>
      <div class="boost-line"><span id="boost-count">0</span> boosts · <span id="stars">☆☆☆</span></div>
    </div>
    <div class="panel panel-right" id="panel-reflect">
      <button class="close-x" data-close="panel-reflect">✕</button>
      <h3>🔍 Weekly Reflection</h3>
      <ul id="reflection-summary"></ul>
      <div class="gentle" id="reflection-suggestion"></div>
      <div class="next" id="reflection-action"></div>
    </div>
  </div>

  <div class="mood-line">
    <span id="mood-word">Okay</span>
    <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
  </div>

  <div class="talk-row">
    <input type="text" id="word-input" placeholder="Say anything to your monster…">
    <button id="btn-tell">Tell 🌷</button>
  </div>
  <div class="mood-chips" id="mood-chips">
    <button class="chip" data-mood="calm">😌 calm</button>
    <button class="chip" data-mood="happy">😊 happy</button>
    <button class="chip" data-mood="grateful">🥰 grateful</button>
    <button class="chip" data-mood="stressed">😫 stressed</button>
    <button class="chip" data-mood="upset">😕 upset</button>
    <button class="chip" data-mood="tired">🥱 tired</button>
  </div>
  <div class="feedback" id="monster-msg"></div>
</div>

<footer>Words have power — Monster Mood Garden</footer>

<script>
(function () {
  var decorationsEl = document.getElementById('decorations');
  var monsterEl = document.getElementById('monster');
  var wrapEl = document.getElementById('monster-wrap');
  var meterFill = document.getElementById('meter-fill');
  var moodWord = document.getElementById('mood-word');
  var monsterMsg = document.getElementById('monster-msg');

  var state = { mood: 1, pimple: 0, stain: 0, fluff: 0, sparkle: 0, bow: 0 };
  var entries = [
    { text: "Nasi lemak breakfast with Mak — best sambal ever", type: "positive", mood: "grateful", day: "Mon" },
    { text: "Stuck in KL traffic for two hours, so fed up", type: "negative", mood: "stressed", day: "Tue" },
    { text: "Rain finally cooled down my hot flat in Cheras", type: "positive", mood: "calm", day: "Wed" }
  ];

  var decoPositions = [
    [36, 70], [160, 64], [100, 30], [30, 145], [172, 140], [92, 56],
    [54, 112], [146, 106], [76, 178], [170, 96], [22, 100], [108, 116],
    [148, 164], [44, 88], [122, 56], [64, 140], [136, 138], [88, 96]
  ];
  var decoIndex = 0;

  function addDeco(kind) {
    var pos = decoPositions[decoIndex % decoPositions.length];
    decoIndex++;
    var d = document.createElement('div');
    d.className = 'deco ' + kind;
    d.style.left = pos[0] + 'px';
    d.style.top = pos[1] + 'px';
    decorationsEl.appendChild(d);
    return d;
  }
  function applyChange(kind, count) {
    state[kind] += count;
    for (var i = 0; i < Math.abs(count); i++) addDeco(kind);
  }
  function applyBow() {
    state.bow++;
    var bow = document.createElement('div');
    bow.className = 'deco bow';
    bow.style.right = (4 + state.bow * 24) + 'px';
    bow.style.top = (state.bow === 1 ? 44 : 30) + 'px';
    decorationsEl.appendChild(bow);
  }

  function updateMonsterFace(animate) {
    var score = state.mood;
    monsterEl.classList.remove('happy', 'sad', 'meh');
    if (score >= 3) monsterEl.classList.add('happy');
    else if (score <= -3) monsterEl.classList.add('sad');
    else monsterEl.classList.add('meh');
    var pct = Math.max(0, Math.min(100, (score + 10) / 20 * 100));
    meterFill.style.width = pct + '%';
    moodWord.textContent =
      score >= 6 ? "Blooming! 🌸" : score >= 3 ? "Happy 😊" : score >= 1 ? "Content 🙂" :
      score > -1 ? "Okay 😐" : score > -3 ? "Gloomy 😕" : score > -6 ? "Grumpy 😖" : "Very messy 😫";
    if (animate) {
      wrapEl.classList.add('bounce');
      setTimeout(function () { wrapEl.classList.remove('bounce'); }, 280);
    }
  }

  // --- sentiment detection: the monster reacts to what you actually wrote ---
  var posWords = ["love","good","great","happy","grateful","thank","glad","nice","best","calm","enjoy","proud","fun","beautiful","sweet","hope","win","relax","peace","awesome","amazing","excited"];
  var negWords = ["hate","tired","stress","angry","sad","fail","awful","terrible","worst","bad","fed up","annoy","upset","lonely","anxious","cry","ugly","stupid","hopeless","worried","pain","sick","angry","mad"];
  function detectType(text) {
    var t = text.toLowerCase(), pos = 0, neg = 0;
    posWords.forEach(function (w) { if (t.indexOf(w) >= 0) pos++; });
    negWords.forEach(function (w) { if (t.indexOf(w) >= 0) neg++; });
    return neg > pos ? 'negative' : 'positive';
  }

  function monsterReact(type) {
    if (type === 'positive') {
      var roll = Math.random(), what;
      if (roll < 0.5) { applyChange('sparkle', 1); what = 'a sparkle ✨'; }
      else if (roll < 0.8) { applyChange('fluff', 1); what = 'a soft fluff ☁️'; }
      else if (state.bow < 2) { applyBow(); what = 'a cute bow 🎀'; }
      else { applyChange('sparkle', 1); what = 'a sparkle ✨'; }
      state.mood = Math.min(10, state.mood + 1);
      monsterMsg.textContent = "Your monster glows — it grew " + what;
    } else {
      var what2 = Math.random() < 0.6 ? (applyChange('pimple', 1), 'one pimple 😖') : (applyChange('stain', 1), 'a stain 🫤');
      state.mood = Math.max(-10, state.mood - 1);
      monsterMsg.textContent = "Ouch… " + what2 + ". Words have power — try a kinder way?";
    }
    updateMonsterFace(true);
  }

  // --- main input: one box, monster judges the words ---
  var selectedMood = null;
  var chips = document.querySelectorAll('.chip');
  chips.forEach(function (c) {
    c.addEventListener('click', function () {
      chips.forEach(function (o) { o.classList.remove('on'); });
      c.classList.add('on');
      selectedMood = c.dataset.mood;
    });
  });

  var dayNames = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  var dayCursor = 3;
  var positiveMoods = ['calm', 'happy', 'grateful'];

  function tell() {
    var input = document.getElementById('word-input');
    var text = input.value.trim();
    if (!text) { monsterMsg.textContent = "Say something to your monster first 🌷"; return; }
    var type = selectedMood
      ? (positiveMoods.indexOf(selectedMood) >= 0 ? 'positive' : 'negative')
      : detectType(text);
    entries.push({ text: text, type: type, mood: selectedMood || (type === 'positive' ? 'happy' : 'upset'), day: dayNames[dayCursor++ % 7] });
    input.value = '';
    selectedMood = null;
    chips.forEach(function (o) { o.classList.remove('on'); });
    document.getElementById('journal-count').textContent = entries.length;
    renderEntries();
    monsterReact(type);
  }
  document.getElementById('btn-tell').addEventListener('click', tell);
  document.getElementById('word-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tell();
  });

  // --- journal panel ---
  function renderEntries() {
    var list = document.getElementById('entry-list');
    list.innerHTML = '';
    entries.slice(-8).forEach(function (en) {
      var li = document.createElement('div');
      li.className = 'entry ' + en.type;
      li.innerHTML = '<span class="dot"></span><span style="flex:1">' + escapeHtml(en.text) + '</span>' +
        '<span class="tag ' + en.mood + '">' + en.mood + '</span><span style="font-size:0.7rem;opacity:0.7">' + en.day + '</span>';
      list.appendChild(li);
    });
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // --- panels open/close around the monster ---
  function closeAll() {
    document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('open'); });
  }
  document.querySelectorAll('.close-x').forEach(function (x) {
    x.addEventListener('click', function () {
      document.getElementById(x.dataset.close).classList.remove('open');
    });
  });
  document.getElementById('btn-journal-open').addEventListener('click', function () {
    var p = document.getElementById('panel-journal');
    var was = p.classList.contains('open'); closeAll();
    if (!was) p.classList.add('open');
  });
  document.getElementById('btn-calm-open').addEventListener('click', function () {
    var p = document.getElementById('panel-calm');
    var was = p.classList.contains('open'); closeAll();
    if (!was) p.classList.add('open');
  });
  document.getElementById('btn-reflect-open').addEventListener('click', function () {
    var p = document.getElementById('panel-reflect');
    var was = p.classList.contains('open'); closeAll();
    if (!was) { buildReflection(); p.classList.add('open'); }
  });

  // --- calm reward ---
  var challenges = [
    { title: "🌈 Tiny Breathing", desc: "Breathe in as the circle grows, out as it shrinks. Tap Done when calm." },
    { title: "🙏 Gratitude Pause", desc: "Name three small things you're thankful for — even one good meal counts." },
    { title: "🤫 Quiet Minute", desc: "Put your phone down, close your eyes, listen to the room for one minute." },
    { title: "🖐️ 5-4-3-2-1 Grounding", desc: "Notice 5 things you see, 4 you hear, 3 you can touch, 2 you smell, 1 you taste." }
  ];
  var challengeIndex = 0, boosts = 0, breathTimer = null;
  function showChallenge() {
    var c = challenges[challengeIndex % challenges.length];
    document.getElementById('challenge-title').textContent = c.title;
    document.getElementById('challenge-desc').textContent = c.desc;
  }
  document.getElementById('btn-next').addEventListener('click', function () { challengeIndex++; showChallenge(); resetBreath(); });
  document.getElementById('btn-start').addEventListener('click', function () {
    var circle = document.getElementById('breath-circle');
    resetBreath();
    var growing = true;
    circle.classList.add('big');
    circle.textContent = 'breathe in';
    breathTimer = setInterval(function () {
      growing = !growing;
      circle.classList.toggle('big', growing);
      circle.textContent = growing ? 'breathe in' : 'breathe out';
    }, 3000);
  });
  function resetBreath() {
    if (breathTimer) { clearInterval(breathTimer); breathTimer = null; }
    var circle = document.getElementById('breath-circle');
    circle.classList.remove('big');
    circle.textContent = 'breathe';
  }
  document.getElementById('btn-done').addEventListener('click', function () {
    resetBreath();
    boosts++;
    var grade = Math.min(3, Math.ceil(boosts / 2));
    document.getElementById('boost-count').textContent = boosts;
    document.getElementById('stars').textContent = '★'.repeat(grade) + '☆'.repeat(3 - grade);
    var roll = Math.random(), what;
    if (roll < 0.4) { applyChange('sparkle', 1); what = 'a new sparkle ✨'; }
    else if (roll < 0.75) { applyChange('fluff', 1); what = 'extra soft fluff ☁️'; }
    else if (state.bow < 3) { applyBow(); what = 'a ribbon bow 🎀'; }
    else { applyChange('sparkle', 1); what = 'a new sparkle ✨'; }
    if (state.pimple + state.stain > 0) {
      var messies = decorationsEl.querySelectorAll('.pimple, .stain');
      if (messies.length > 0) {
        messies[0].style.transition = 'opacity 0.6s';
        messies[0].style.opacity = '0';
        (function (el) { setTimeout(function () { el.remove(); }, 700); })(messies[0]);
        if (state.pimple > 0) state.pimple--; else state.stain--;
        what += " and one messy mark faded";
      }
    }
    state.mood = Math.min(10, state.mood + 2);
    updateMonsterFace(true);
    monsterMsg.textContent = "Calm earned — your monster got " + what + " 🎉";
  });

  // --- weekly reflection ---
  function buildReflection() {
    var pos = 0, neg = 0, moodCounts = {};
    entries.forEach(function (en) {
      if (en.type === 'positive') pos++; else neg++;
      moodCounts[en.mood] = (moodCounts[en.mood] || 0) + 1;
    });
    var topMood = null, topN = 0;
    Object.keys(moodCounts).forEach(function (m) { if (moodCounts[m] > topN) { topN = moodCounts[m]; topMood = m; } });
    var summary = document.getElementById('reflection-summary');
    summary.innerHTML = '';
    [
      pos + " kind and " + neg + " harsh phrase" + (neg === 1 ? "" : "s") + " so far",
      "Most common mood: " + (topMood || "none yet"),
      "Monster: " + state.sparkle + " ✨ · " + state.fluff + " fluff · " + state.pimple + " pimple · " + state.stain + " stain"
    ].forEach(function (line) {
      var li = document.createElement('li'); li.textContent = line; summary.appendChild(li);
    });
    var sug = document.getElementById('reflection-suggestion');
    var act = document.getElementById('reflection-action');
    if (neg > pos) {
      sug.textContent = "More harsh words than kind ones — noticing that is already a big step. Try pairing each harsh thought with one gentle truth.";
      act.textContent = "Next: add one kind phrase about a small moment today, like a meal or a chat.";
    } else if (neg === 0) {
      sug.textContent = "All kind words so far — your monster is glowing! Keep noticing small good things.";
      act.textContent = "Next: try a 🌈 Calm challenge to keep the glow going.";
    } else {
      sug.textContent = "Kind words are ahead — nice balance. On rough days, write the harsh thought, then one kinder reply underneath.";
      act.textContent = "Next: use the 🤫 Quiet Minute before your next harsh phrase.";
    }
  }

  // --- dark / light ---
  var themeBtn = document.getElementById('btn-theme');
  themeBtn.addEventListener('click', function () {
    document.documentElement.classList.toggle('dark');
    var dark = document.documentElement.classList.contains('dark');
    themeBtn.textContent = dark ? '☀️' : '🌙';
  });

  // --- init: seeded state, never empty ---
  addDeco('sparkle'); addDeco('sparkle');
  addDeco('stain'); addDeco('pimple');
  state.sparkle = 2; state.stain = 1; state.pimple = 1;
  updateMonsterFace(false);
  renderEntries();
  showChallenge();
})();
</script>
</body>
</html>
